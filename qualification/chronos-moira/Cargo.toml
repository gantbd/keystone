[workspace]
members = ["."]
resolver = "3"

[package]
name = "keystone-qualification-chronos-moira"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/keystone"
publish = false
description = "Cross-project semantic qualification for Keystone effect evidence"

[dependencies]
chronos-engine = { version = "=0.3.0", path = "../../../chronos" }
keystone-effects = { version = "=0.0.1", path = "../../crates/keystone-effects" }
moira-core = { version = "=0.0.1", path = "../../../moira" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

